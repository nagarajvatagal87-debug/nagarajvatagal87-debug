<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b3e"/>
      <stop offset="100%" stop-color="#1F3864"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#13294b"/>
      <stop offset="100%" stop-color="#0a1730"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9d3e0"/>
      <stop offset="100%" stop-color="#9fb0c9"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b7c2d4"/>
      <stop offset="100%" stop-color="#8797b3"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#bg)"/>

  <circle cx="90" cy="60" r="3" fill="#6fa8ff" opacity="0.6">
    <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="230" r="2.5" fill="#8fd3ff" opacity="0.5">
    <animate attributeName="cy" values="230;210;230" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="50" r="3" fill="#6fa8ff" opacity="0.5">
    <animate attributeName="cy" values="50;70;50" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="220" r="2" fill="#8fd3ff" opacity="0.6">
    <animate attributeName="cy" values="220;200;220" dur="4.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="150" r="2" fill="#ffffff" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.05;0.35" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <text x="440" y="55" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="30" font-weight="700" fill="#ffffff">
    Nagaraj Vatagal
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="440" y="82" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="15" fill="#a9c1e8">
    Full-Stack Developer &#8226; AI/LLM Integrations &#8226; MCA Student
    <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
  </text>

  <g transform="translate(280,105)">
    <rect x="0" y="0" width="280" height="170" rx="12" fill="url(#lidGrad)"/>
    <rect x="10" y="10" width="260" height="150" rx="6" fill="url(#screenGlow)"/>

    <circle cx="26" cy="26" r="4" fill="#ff5f57"/>
    <circle cx="40" cy="26" r="4" fill="#febc2e"/>
    <circle cx="54" cy="26" r="4" fill="#28c840"/>

    <g font-family="Consolas, monospace" font-size="11">
      <rect x="24" y="42" height="6" rx="3" fill="#6fa8ff">
        <animate attributeName="width" values="0;120;120;0" keyTimes="0;0.2;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="58" height="6" rx="3" fill="#8fd3ff">
        <animate attributeName="width" values="0;0;180;180;0" keyTimes="0;0.12;0.32;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="74" height="6" rx="3" fill="#ffd166">
        <animate attributeName="width" values="0;0;150;150;0" keyTimes="0;0.24;0.44;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="90" height="6" rx="3" fill="#ffd166">
        <animate attributeName="width" values="0;0;110;110;0" keyTimes="0;0.36;0.52;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="106" height="6" rx="3" fill="#6fa8ff">
        <animate attributeName="width" values="0;0;90;90;0" keyTimes="0;0.48;0.62;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="122" height="6" rx="3" fill="#8fd3ff">
        <animate attributeName="width" values="0;0;200;200;0" keyTimes="0;0.6;0.8;0.9;1" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="24" y="136" width="6" height="8" fill="#ffffff">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.55;0.95;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <path d="M -20 170 L 300 170 L 320 205 L -40 205 Z" fill="url(#baseGrad)"/>
    <rect x="70" y="182" width="140" height="6" rx="3" fill="#5c6b85"/>
  </g>

  <g transform="translate(390,290)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="34" ry="9" fill="#0a1730"/>
    <ellipse cx="90" cy="0" rx="34" ry="9" fill="#0a1730"/>
  </g>
</svg>
